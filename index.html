<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="laxita@debian — Personal website" />
  <meta property="og:title" content="laxita(21)" />
  <meta property="og:description" content="fastfetch laxita" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://laxita.dev" />
  <link rel="icon" type="image/png" href="images/acorn.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <title>ssh user@laxita.dev</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a08;
      --text: #d4c5a9;
      --accent: #c8903a;
      --accent-dim: #a06b1f;
      --accent-bright: #f0c966;
      --muted: #6b5c47;
      --purple: #3b254b;
      --purple-bright: #b294d1;
      --link-hover-bg: #3b254b;
      --link-hover-fg: #f0c966;
    }

    body {
      font-family: "JetBrains Mono", "Roboto Mono", monospace;
      font-variant-ligatures: none;
      font-size: 14px;
      line-height: 1.5;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    ::selection {
      background: var(--purple);
      color: var(--accent-bright);
    }

    ::-moz-selection {
      background: var(--purple);
      color: var(--accent-bright);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      background-color: var(--link-hover-bg);
      color: var(--link-hover-fg);
    }

    .terminal {
      width: 820px;
      max-width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      padding: 2rem 1.5rem;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .prompt-line {
      word-break: break-all;
    }

    .prompt-user {
      color: var(--accent);
      font-weight: 700;
    }

    .prompt-separator {
      color: var(--text);
    }

    .prompt-path {
      color: #e8b84b;
      font-weight: 700;
    }

    .prompt-dollar {
      color: var(--text);
    }

    .prompt-cmd {
      color: var(--text);
      white-space: pre-wrap;
    }

    .entry {
      margin-bottom: 0.25rem;
    }

    .output {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 0.75rem;
    }

    .output.pre {
      white-space: pre;
      word-break: normal;
      overflow-x: auto;
    }

    .output .dir-name {
      color: var(--accent-bright);
      font-weight: 700;
    }

    .output .muted {
      color: var(--muted);
    }

    .output .cmd-name {
      color: var(--accent);
      font-weight: 700;
    }

    .output .acorn {
      color: var(--purple-bright);
      font-weight: 700;
    }

    .output:has(.project-card),
    .output:has(.experience-card),
    .output:has(.cert-entry) {
      white-space: normal;
    }

    .project-card {
      border: 1px solid var(--accent-dim);
      padding: 0.35rem 1rem 0.75rem;
      margin: 0.25rem 0 0.5rem;
      display: inline-block;
      min-width: min(100%, 38rem);
      max-width: 100%;
    }

    .project-card legend {
      color: var(--accent-bright);
      font-weight: 700;
      padding: 0 0.4rem;
    }

    .project-table {
      border-collapse: collapse;
      width: 100%;
    }

    .project-table th {
      color: var(--accent);
      font-weight: 700;
      text-align: left;
      vertical-align: top;
      padding: 0.35rem 1.25rem 0.35rem 0;
      white-space: nowrap;
    }

    .project-table td {
      vertical-align: top;
      padding: 0.35rem 0;
    }

    .experience-card {
      border: 1px solid rgba(178, 148, 209, 0.45);
      padding: 0.35rem 1rem 0.75rem;
      margin: 0.25rem 0 0.5rem;
      display: inline-block;
      min-width: min(100%, 38rem);
      max-width: 100%;
    }

    .experience-card legend {
      color: var(--purple-bright);
      font-weight: 700;
      padding: 0 0.4rem;
    }

    .experience-table {
      border-collapse: collapse;
      width: 100%;
    }

    .experience-table th {
      color: var(--purple-bright);
      font-weight: 700;
      text-align: left;
      vertical-align: top;
      padding: 0.35rem 1.25rem 0.35rem 0;
      white-space: nowrap;
    }

    .experience-table td {
      vertical-align: top;
      padding: 0.35rem 0;
    }

    .cert-entry {
      margin-bottom: 0.75rem;
    }

    .cert-entry:last-child {
      margin-bottom: 0;
    }

    .cert-table {
      border-collapse: collapse;
      border: none;
    }

    .cert-table th,
    .cert-table td {
      border: none;
      vertical-align: top;
      padding: 0.2rem 0;
      text-align: left;
    }

    .cert-table th {
      color: var(--purple-bright);
      font-weight: 700;
      padding-right: 1rem;
      white-space: nowrap;
    }

    .cert-table td {
      color: var(--accent-bright);
    }

    .cert-verify {
      margin-top: 0.35rem;
    }

    .cert-verify-link {
      display: inline-block;
      background-color: var(--purple);
      color: var(--accent-bright);
      font-weight: 700;
      padding: 0.2rem 0.5rem;
    }

    .cert-verify-link:hover {
      background-color: var(--link-hover-bg);
      color: var(--accent-bright);
    }

    .fastfetch {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .ascii-art {
      color: var(--accent);
      white-space: pre;
      font-size: 5.5px;
      line-height: 1.15;
      flex-shrink: 0;
      user-select: none;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .info-header {
      font-weight: 700;
      margin-bottom: 0;
    }

    .info-header .user {
      color: var(--accent);
    }

    .info-header .at {
      color: var(--text);
    }

    .info-header .host {
      color: var(--accent);
    }

    .info-separator {
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .info-row {
      display: flex;
      flex-wrap: wrap;
    }

    .info-label {
      color: var(--accent);
      font-weight: 700;
      min-width: 0;
      margin-right: 0.5rem;
      white-space: nowrap;
    }

    .info-value {
      color: var(--text);
    }

    .info-value a {
      font-weight: 400;
    }

    .color-blocks {
      display: flex;
      gap: 0;
      margin-top: 1rem;
    }

    .color-block {
      width: 3ch;
      height: 1.5em;
      display: inline-block;
    }

    .section-gap {
      height: 0.75rem;
    }

    .input-line {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
    }

    .input-line .cursor-block {
      display: inline-block;
      width: 0.6em;
      height: 1.15em;
      background: var(--purple);
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 1s step-end infinite;
      align-self: center;
    }

    #hiddenInput {
      position: fixed;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      border: none;
      padding: 0;
      background: transparent;
      color: transparent;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      body {
        font-size: 12px;
      }

      .fastfetch {
        flex-direction: column;
        gap: 1rem;
      }

      .ascii-art {
        font-size: 3.5px;
        line-height: 1.1;
        text-align: center;
      }

      .terminal {
        width: 100% !important;
        padding: 1rem;
      }
    }
  </style>
</head>
